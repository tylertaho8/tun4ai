name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          brew install shellcheck
          shellcheck -x install.sh uninstall.sh helper/*.sh scripts/*.sh tests/*.sh

      - name: fetch sing-box
        run: ./scripts/fetch-sing-box.sh build

      - name: render tests
        run: /usr/bin/python3 -m unittest discover -s tests -v

      - name: staged install
        run: bash tests/test_install.sh

      - name: tray tests
        working-directory: tray
        run: cargo test --locked

      - name: bundle app
        run: ./scripts/bundle-app.sh build/tun4ai.app
