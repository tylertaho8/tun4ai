name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: tools
        run: brew install shellcheck

      # Same entry point as on a dev machine: shellcheck, render/CLI tests, staged install, tray tests.
      - name: make check
        run: make check

      - name: bundle app
        run: |
          ./scripts/bundle-app.sh build/tun4ai.app
          test -x build/tun4ai.app/Contents/Resources/fetch-sing-box.sh
          test -f build/tun4ai.app/Contents/Resources/helper/install-root.sh
          test -f build/tun4ai.app/Contents/Resources/examples/nodes.txt
          test -f build/tun4ai.app/Contents/Resources/helper/nodes.py
          test -x build/tun4ai.app/Contents/Resources/helper/tun4ai
          test -f build/tun4ai.app/Contents/Resources/examples/direct.txt
