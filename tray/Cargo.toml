[package]
name = "tun4ai"
version = "0.1.0"
edition = "2021"
description = "Menu bar switch for a system-wide TUN tunnel with a kill switch on macOS"
license = "MIT"
repository = "https://github.com/tylertaho8/tun4ai"
publish = false

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSCell", "NSClipView", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSPanel", "NSScreen", "NSScrollView", "NSSwitch", "NSText", "NSTextField", "NSTrackingArea", "NSView", "NSVisualEffectView", "NSWindow", "block2", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSDate", "NSGeometry", "NSRunLoop", "NSString"] }
serde_json = "1"
tray-icon = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
